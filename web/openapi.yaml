openapi: 3.0.3
info:
  title: work-tracker API
  description: Automatically generated OpenAPI spec from Postman collection "work-tracker"
  version: 1.0.0
servers:
  - url: http://127.0.0.1:5000
    description: Default local server
paths:
  /api/login:
    post:
      summary: Login
      description: Account and password are case-insensitive (accounts are stored in upper case). The returned JWT carries `sub` (account), `name`, `role` and `i18n` claims.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/logout:
    post:
      summary: Logout
      operationId: logout
      responses:
        '204':
          description: No Content

  /api/me:
    get:
      summary: Get the logged-in user
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Update the logged-in user's preferences
      description: Returns a new JWT carrying the updated `i18n` claim.
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/password:
    put:
      summary: Change the logged-in user's password
      description: Not allowed for the system (config) admin.
      operationId: changeMyPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMyPasswordRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users:
    get:
      summary: List users (admin)
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a user (admin)
      description: The account is stored in upper case. The new user's initial password is its account; passwords are case-insensitive.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{account}:
    parameters:
      - name: account
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update a user (admin)
      description: Only the given fields are changed. The system admin cannot be updated.
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a user (admin)
      description: The system admin and the caller themself cannot be deleted.
      operationId: deleteUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/work/options:
    get:
      summary: Get task categories, projects and the work table setting
      description: Categories and projects include inactive ones, so old entries can still show their names.
      operationId: getWorkOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOptionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/work/members:
    get:
      summary: List members for the everyone's work table
      description: Allowed for admins, and for everyone when `allowViewAll` is on.
      operationId: listWorkMembers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkMembersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/work-records:
    get:
      summary: List everyone's work records
      description: Every record dated from..to (the frontend asks for one week), newest date first. Allowed for admins, and for everyone when `allowViewAll` is on.
      operationId: listAllWorkRecords
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: account
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRecordListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/work-records:
    get:
      summary: List my work records
      description: Every record dated from..to (the frontend asks for one week), newest date first.
      operationId: listMyWorkRecords
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRecordListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Add a work record
      operationId: createMyWorkRecord
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWorkEntryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/work-records/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Replace one of my work records
      operationId: updateMyWorkRecord
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWorkEntryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete one of my work records
      operationId: deleteMyWorkRecord
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/todos:
    get:
      summary: List my todos
      description: Sorted by date, earliest first.
      operationId: listMyTodos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodosResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Add a todo
      operationId: createMyTodo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWorkEntryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/todos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Replace one of my todos
      operationId: updateMyTodo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWorkEntryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete one of my todos
      operationId: deleteMyTodo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/todos/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Complete a todo
      description: Deletes the todo and adds it as a work record dated `date` (the client's today). Answers 400 and keeps the todo when the record would lack a category or hours.
      operationId: completeMyTodo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTodoRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/categories:
    post:
      summary: Add a task category (admin)
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/WorkOptionOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Rename or (de)activate a task category (admin)
      operationId: updateCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkOptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/WorkOptionOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a task category (admin)
      description: Work records and todos using it get an empty categoryId. `cleared` is how many were changed.
      operationId: deleteCategory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkOptionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/projects:
    post:
      summary: Add a project (admin)
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/WorkOptionOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Rename or (de)activate a project (admin)
      operationId: updateProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkOptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/WorkOptionOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a project (admin)
      description: Work records and todos using it get an empty projectId. `cleared` is how many were changed.
      operationId: deleteProject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkOptionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/settings/work:
    put:
      summary: Update the work table setting (admin)
      operationId: updateWorkSetting
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkSettingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSettingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/week-summary:
    get:
      summary: Summarize my week
      description: >-
        Records and hours of the 7 days starting at `from`, and the hours to
        log: 8 per workday, where workdays are Monday-Friday minus holidays plus
        makeup workdays from the holiday calendar.
      operationId: getWeekSummary
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: First day of the week (a Monday in the UI), YYYY-MM-DD.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/holidays:
    get:
      summary: List a year's holiday calendar
      description: The effective entry per date (a manual entry wins over the government one).
      operationId: listHolidays
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: string
            example: '2026'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidaysResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/holidays/sync:
    post:
      summary: Sync the government office calendar now (admin)
      description: Replaces the government entries of this year and the next; manual entries are kept.
      operationId: syncHolidays
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncHolidaysResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: The office calendar could not be fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/holidays/{date}:
    parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
    put:
      summary: Set a manual holiday or makeup workday (admin)
      description: Creates or replaces the manual entry of the date; it wins over the government entry.
      operationId: saveHoliday
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveHolidayRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a manual holiday entry (admin)
      description: The government entry of the date, if any, applies again.
      operationId: deleteHoliday
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/work/missing:
    get:
      summary: List who missed logging work
      description: >-
        For everyone but the system admin, the workdays of the 30 days ending
        at `to` (but not before the work start date) without any work record (todos do not count). Weekends and
        holidays are skipped, makeup workdays count, and days before an
        account was created are skipped. Only members with missing days are
        listed, most missing first. Allowed for admins, and for everyone when
        `allowViewAll` is on.
      operationId: listMissingEntries
      security:
        - bearerAuth: []
      parameters:
        - name: to
          in: query
          required: true
          description: Last day checked (the client's yesterday), YYYY-MM-DD.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingEntriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/system/backup:
    get:
      summary: Download a full backup (admin)
      description: >-
        A zip with manifest.json and one JSON file per table (account,
        category, project, work, todo, holiday, setting). Accounts include
        their password hashes.
      operationId: downloadBackup
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The backup zip
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/system/restore:
    post:
      summary: Replace all data with a backup (admin)
      description: >-
        Replaces every table with the uploaded backup zip (at most 50 MB). A
        file that is not a Work Tracker backup is refused and nothing changes.
        The config admin is re-applied afterwards.
      operationId: restoreBackup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/system/reset:
    post:
      summary: Delete all data (admin)
      description: >-
        Like a fresh install, only the config admin is left and government
        holidays sync again.
      operationId: resetSystem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/api-tokens:
    get:
      summary: List my API tokens
      description: The tokens themselves are never returned again; only their prefix.
      operationId: listMyApiTokens
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokensResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create an API token
      description: >-
        Returns the token (wt_...) once; only its SHA-256 is stored. Use it as
        `Authorization: Bearer <token>`; it has the same permissions as its
        account. At most 10 per account.
      operationId: createMyApiToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/api-tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      summary: Revoke one of my API tokens
      operationId: deleteMyApiToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  # add `security: [ { bearerAuth: [] } ]` to any path served behind the
  # backend's auth middleware
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A JWT from /api/login, or a personal API token (wt_...) from /api/me/api-tokens.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    From:
      name: from
      in: query
      required: true
      description: Inclusive start date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: true
      description: Inclusive end date (YYYY-MM-DD), not before `from`.
      schema:
        type: string
        format: date
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    WorkOptionOk:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkOptionResponse'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
  schemas:
    Role:
      type: string
      enum:
        - admin
        - default
    I18n:
      type: string
      enum:
        - zh-TW
        - en
    User:
      type: object
      required:
        - account
        - name
        - role
        - i18n
        - isSystem
      properties:
        account:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        i18n:
          $ref: '#/components/schemas/I18n'
        isSystem:
          type: boolean
          description: True for the admin defined in the backend config file.
    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          example: admin
        password:
          type: string
          example: '0000'
    LoginResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
    TokenResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
    UpdateMeRequest:
      type: object
      required:
        - i18n
      properties:
        i18n:
          $ref: '#/components/schemas/I18n'
    ChangeMyPasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
    CreateUserRequest:
      type: object
      required:
        - account
        - name
        - role
        - i18n
      properties:
        account:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        i18n:
          $ref: '#/components/schemas/I18n'
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        i18n:
          $ref: '#/components/schemas/I18n'
    UserResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
    ListUsersResponse:
      type: object
      required:
        - message
        - users
      properties:
        message:
          type: string
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    CategoryColor:
      type: string
      description: Palette color name of a task category. Projects have no color. New categories get the least used color.
      enum:
        - blue
        - sky
        - teal
        - green
        - lime
        - amber
        - orange
        - red
        - pink
        - purple
    WorkOption:
      type: object
      required:
        - id
        - name
        - active
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
          description: Inactive options are hidden from new entries but still name old ones.
        color:
          $ref: '#/components/schemas/CategoryColor'
    WorkOptionsResponse:
      type: object
      required:
        - message
        - categories
        - projects
        - allowViewAll
      properties:
        message:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/WorkOption'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/WorkOption'
        allowViewAll:
          type: boolean
        startDate:
          type: string
          format: date
          description: Missing when not set.
    CreateWorkOptionRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    UpdateWorkOptionRequest:
      type: object
      properties:
        name:
          type: string
        active:
          type: boolean
        color:
          $ref: '#/components/schemas/CategoryColor'
    WorkOptionResponse:
      type: object
      required:
        - message
        - option
      properties:
        message:
          type: string
        option:
          $ref: '#/components/schemas/WorkOption'
    DeleteWorkOptionResponse:
      type: object
      required:
        - message
        - cleared
      properties:
        message:
          type: string
        cleared:
          type: integer
          description: Number of work records and todos that no longer reference the deleted option.
    UpdateWorkSettingRequest:
      type: object
      description: Only the given fields are changed.
      properties:
        allowViewAll:
          type: boolean
        startDate:
          type: string
          description: When the team started logging (YYYY-MM-DD); missed entries are not checked before it. An empty string clears it.
    WorkSettingResponse:
      type: object
      required:
        - message
        - allowViewAll
      properties:
        message:
          type: string
        allowViewAll:
          type: boolean
        startDate:
          type: string
          format: date
    SaveWorkEntryRequest:
      type: object
      description: >-
        Work records require categoryId and hours; todos only require date.
        description and projectId are always optional.
      required:
        - date
      properties:
        date:
          type: string
          format: date
          example: '2026-09-29'
        categoryId:
          type: string
        description:
          type: string
        hours:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 24
          multipleOf: 0.5
        projectId:
          type: string
    WorkRecord:
      type: object
      description: Optional fields are empty ("" / 0) when not set. Records always have categoryId and hours; todos may not.
      required:
        - id
        - account
        - date
        - categoryId
        - description
        - hours
        - projectId
        - createdAt
      properties:
        id:
          type: string
        account:
          type: string
        date:
          type: string
          format: date
        categoryId:
          type: string
        description:
          type: string
        hours:
          type: number
        projectId:
          type: string
        createdAt:
          type: string
          format: date-time
    Todo:
      $ref: '#/components/schemas/WorkRecord'
    WorkRecordListResponse:
      type: object
      required:
        - message
        - records
        - total
        - totalHours
      properties:
        message:
          type: string
        records:
          type: array
          items:
            $ref: '#/components/schemas/WorkRecord'
        total:
          type: integer
        totalHours:
          type: number
    WorkRecordResponse:
      type: object
      required:
        - message
        - record
      properties:
        message:
          type: string
        record:
          $ref: '#/components/schemas/WorkRecord'
    TodosResponse:
      type: object
      required:
        - message
        - todos
      properties:
        message:
          type: string
        todos:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
    TodoResponse:
      type: object
      required:
        - message
        - todo
      properties:
        message:
          type: string
        todo:
          $ref: '#/components/schemas/Todo'
    CompleteTodoRequest:
      type: object
      description: categoryId, hours and projectId fill or override the todo's; the resulting record needs a category and hours.
      required:
        - date
      properties:
        date:
          type: string
          format: date
        categoryId:
          type: string
        hours:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 24
          multipleOf: 0.5
        projectId:
          type: string
    WorkMember:
      type: object
      required:
        - account
        - name
      properties:
        account:
          type: string
        name:
          type: string
    WorkMembersResponse:
      type: object
      required:
        - message
        - members
      properties:
        message:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/WorkMember'
    HolidayType:
      type: string
      description: holiday = a weekday off; workday = a working weekend day.
      enum:
        - holiday
        - workday
    HolidaySource:
      type: string
      description: gov = synced from the office calendar; manual = set by an admin (wins over gov).
      enum:
        - gov
        - manual
    Holiday:
      type: object
      required:
        - date
        - name
        - type
        - source
      properties:
        date:
          type: string
          format: date
        name:
          type: string
        type:
          $ref: '#/components/schemas/HolidayType'
        source:
          $ref: '#/components/schemas/HolidaySource'
    HolidaysResponse:
      type: object
      required:
        - message
        - holidays
      properties:
        message:
          type: string
        holidays:
          type: array
          items:
            $ref: '#/components/schemas/Holiday'
        lastSyncedAt:
          type: string
          format: date-time
          description: Missing before the first successful sync.
    SaveHolidayRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/HolidayType'
    HolidayResponse:
      type: object
      required:
        - message
        - holiday
      properties:
        message:
          type: string
        holiday:
          $ref: '#/components/schemas/Holiday'
    SyncHolidaysResponse:
      type: object
      required:
        - message
        - synced
        - lastSyncedAt
      properties:
        message:
          type: string
        synced:
          type: integer
        lastSyncedAt:
          type: string
          format: date-time
    WeekDay:
      type: object
      required:
        - date
        - workday
        - loggedHours
        - requiredHours
      properties:
        date:
          type: string
          format: date
        workday:
          type: boolean
        holidayName:
          type: string
          description: Name of the holiday or makeup workday on this date.
        loggedHours:
          type: number
        requiredHours:
          type: number
    WeekSummaryResponse:
      type: object
      required:
        - message
        - from
        - to
        - recordCount
        - loggedHours
        - requiredHours
        - remainingHours
        - daysOff
        - days
      properties:
        message:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        recordCount:
          type: integer
        loggedHours:
          type: number
        requiredHours:
          type: number
        remainingHours:
          type: number
          description: requiredHours - loggedHours, never below 0.
        daysOff:
          type: integer
          description: Weekdays off in the week.
        days:
          type: array
          items:
            $ref: '#/components/schemas/WeekDay'
    MissingMember:
      type: object
      required:
        - account
        - name
        - missingCount
        - missingDates
      properties:
        account:
          type: string
        name:
          type: string
        missingCount:
          type: integer
        missingDates:
          type: array
          items:
            type: string
            format: date
    MissingEntriesResponse:
      type: object
      required:
        - message
        - from
        - to
        - workdays
        - checkedCount
        - members
      properties:
        message:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        workdays:
          type: integer
          description: Workdays in the range.
        checkedCount:
          type: integer
          description: Accounts checked (everyone but the system admin).
        members:
          type: array
          items:
            $ref: '#/components/schemas/MissingMember'
    ResetRequest:
      type: object
      required:
        - confirm
      properties:
        confirm:
          type: string
          description: Must be RESET.
          example: RESET
    ApiTokenInfo:
      type: object
      required:
        - id
        - name
        - prefix
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the token, to recognize it.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Missing until the token is first used; updated at most once a minute.
    ApiTokensResponse:
      type: object
      required:
        - message
        - tokens
      properties:
        message:
          type: string
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/ApiTokenInfo'
    CreateApiTokenRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Claude Code skill
        expiresInDays:
          type: integer
          description: Defaults to 365.
          enum:
            - 30
            - 60
            - 180
            - 365
    CreateApiTokenResponse:
      type: object
      required:
        - message
        - token
        - apiToken
      properties:
        message:
          type: string
        token:
          type: string
          description: The token itself, shown only in this response.
        apiToken:
          $ref: '#/components/schemas/ApiTokenInfo'
    MessageResponse:
      type: object
      properties:
        message:
          type: string
