name: Docker

on:
  schedule:
    - cron: '14 19 * * *'  # UTC 19:14 (Local 03:14)
  push:
    tags: ['v*.*.*']
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: alonza0314/work-tracker

jobs:
  build:
    name: Build Check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: make dockertest

      - name: Test Docker image
        run: |
          docker images
          docker run --rm ${{ env.IMAGE_NAME }}:test ls /wt/wt
          docker run --rm ${{ env.IMAGE_NAME }}:test ls /wt/frontend

      - name: Set up Go for the integration test
        uses: actions/setup-go@v5
        with:
          go-version-file: integration-test/goTest/go.mod
          cache: false

      # each case runs against a fresh compose of the test image; the first
      # failing case stops the step and fails the job
      - name: Integration test
        run: |
          ./integration-test/test.sh TestLogin
          ./integration-test/test.sh TestFrontend
          ./integration-test/test.sh TestProfile
          ./integration-test/test.sh TestUserManagement
          ./integration-test/test.sh TestWorkOptions
          ./integration-test/test.sh TestWorkRecords
          ./integration-test/test.sh TestTodos
          ./integration-test/test.sh TestEveryonesWork
          ./integration-test/test.sh TestWeekSummary
          ./integration-test/test.sh TestHolidays
          ./integration-test/test.sh TestMissingEntries
          ./integration-test/test.sh TestApiTokens
          ./integration-test/test.sh TestBackupRestore
          ./integration-test/test.sh TestReset
          ./integration-test/test.sh TestStress

  version-release:
    name: Release Version Image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  latest-release:
    name: Release Latest Image
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
